units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
  # padding to the right of keys for microcontroller
  pmc: 2.4px
  # microcontroller dimensions
  mx: 18
  my: 33
  $default_width: cx
  $default_height: cy

points:
  zones:
    # The primary 6x4 key matrix, plus 3 modifiers.
    matrix:
      # Choc spacing
      key:
        padding: 1ky
        spread: 1kx
      columns:
        # Hide the first two mods and the last mod.
        # Provide a Sofle-like column stagger.
        outer:
          rows.mod.skip: true
        pinky:
          rows.mod.skip: true
        ring:
          key.stagger: 5
        middle:
          key.stagger: 2.5
        index:
          key.stagger: -2.5
        inner:
          rows.mod.skip: true
          key.stagger: -2.5
      rows:
        # Four main rows, one partial row.
        mod:
        bottom:
        home:
        top:
        num:
    # Thumb cluster for Layer and Space keys.
    thumbs:
      # Choc spacing
      key:
        padding: 1ky
        spread: 1kx
      # Place thumbs where the inner mod would go.
      anchor:
        ref: matrix_inner_mod
        shift: [2, -2]
      columns:
        # Fan thumbs out by -15 degrees.
        layer:
          key:
            splay: -15
        # Spacebar uses a 1.5 wide key.
        space:
          key:
            width: 1.5kx
            splay: 75
            shift: [0,-2]
      rows:
        # Thumbs only have one row.
        cluster:
outlines:
  # Pure key outline.
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  # Key outlines with 0.5mm removed to show key overlaps.
  keys_no_thumb:
    - what: rectangle
      where: true
      size: [kx-0.5,ky-0.5]
  thumb:
    - what: rectangle
      where: thumbs_space_cluster
      size: [1.5kx-0.5, 1ky-0.5]
  keys:
    - "keys_no_thumb"
    - "thumb"
  _micro:
    - what: rectangle
      where:
          ref.aggregate.parts:
            - ref: matrix_inner_num
            - - ref: matrix_inner_num
              - ref: matrix_index_num
                shift: [pmc+0.5kx,0]
                affect: "x"
          # rotate: -90
      adjust:
        shift: [0, -10]
      size: [mx, my]
  plate_keys:
    - what: rectangle
      where: true
      size: 14
  right_side:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_index_num
          shift: [0.5px,0.5ky]
        - ref: matrix_index_num
          shift: [pmc,0.5ky]
        - shift: [0, -4.2ky]
        - ref: thumbs_space_cluster
          shift: [0.65px,-0.5py]
        - ref: thumbs_space_cluster
          shift: [-0.75px,-0.5py]
        - ref: thumbs_space_cluster
          shift: [-0.75px,0.5py]
        - ref: matrix_index_mod
          shift: [2, -0.5py]
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-0.5px,0.5py]
        - ref: matrix_middle_num
          shift: [-0.75px,0.5py]
        - ref: matrix_middle_num
          shift: [0.75px,0.5py]
        - ref: matrix_inner_num
          shift: [0.5px,0.5py]
        - ref: matrix_index_mod
          shift: [0.2px,-0.5py]
        - ref: matrix_ring_mod
          shift: [-0.3px,-0.5py]
        - ref: matrix_outer_bottom
          shift: [-0.5px,-0.5py]
  outline:
    - "board"
    - operation: add
      name: "right_side"
      fillet: 2
  combo:
    - "outline"
    - "-keys"
    # - "-_micro"
  plate:
    - "outline"
    - "-plate_keys"
pcbs.main:
  outlines.main:
    outline: outline
  footprints:
    switch:
      what: choc
      where: true
      params:
        keycaps: true
        reverse: true
        hotswap: true
        from: "{{column_net}}"
        to: "{{colrow}}"
    diode:
      what: diode
      where: true
      params:
        from: "{{colrow}}"
        to: "{{row_net}}"
      adjust:
        shift: [0, -5]
    controller:
      what: promicro
      params:
        orientation: "down"
      where:
        ref.aggregate.parts:
          - ref: matrix_inner_num
          - - ref: matrix_inner_num
            - ref: matrix_index_num
              shift: [pmc+0.5kx,0]
              affect: "x"
        shift: [0, -10]
        rotate: -90
